spring:
  application:
    name: klinikku-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/klinikku}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/docs/openapi.json

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:dev-only-change-this-secret-before-production}
    session-cookie-name: ${APP_AUTH_SESSION_COOKIE_NAME:session}
    session-cookie-secure: ${APP_AUTH_SESSION_COOKIE_SECURE:false}
    session-cookie-same-site: ${APP_AUTH_SESSION_COOKIE_SAME_SITE:Lax}
    session-ttl: ${APP_AUTH_SESSION_TTL:PT8H}
